<svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="640" height="220" fill="#0b1020"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1b2438" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="640" height="220" fill="url(#grid)" opacity="0.5"/>

  <!-- Graph nodes (institutions, scholars, addresses) -->
  <!-- Institutions -->
  <circle cx="140" cy="80" r="10" fill="#4fd1c5"/>
  <circle cx="200" cy="60" r="10" fill="#4fd1c5"/>
  <circle cx="220" cy="110" r="10" fill="#4fd1c5"/>
  <!-- Suspicious institutions -->
  <circle cx="180" cy="140" r="11" fill="#f56565"/>
  <circle cx="240" cy="150" r="11" fill="#f56565"/>

  <!-- Scholars -->
  <circle cx="320" cy="60" r="6" fill="#ecc94b"/>
  <circle cx="340" cy="100" r="6" fill="#ecc94b"/>
  <circle cx="310" cy="140" r="6" fill="#ecc94b"/>

  <!-- Addresses -->
  <rect x="80" y="140" width="14" height="14" fill="#9f7aea" rx="2"/>
  <rect x="100" y="170" width="14" height="14" fill="#9f7aea" rx="2"/>
  <rect x="60" y="180" width="14" height="14" fill="#9f7aea" rx="2"/>

  <!-- Edges -->
  <line x1="140" y1="80" x2="320" y2="60" stroke="#718096" stroke-width="1"/>
  <line x1="200" y1="60" x2="340" y2="100" stroke="#718096" stroke-width="1"/>
  <line x1="220" y1="110" x2="310" y2="140" stroke="#718096" stroke-width="1"/>

  <line x1="180" y1="140" x2="320" y2="60" stroke="#f56565" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="240" y1="150" x2="340" y2="100" stroke="#f56565" stroke-width="1.2" stroke-dasharray="3 3"/>

  <line x1="140" y1="80" x2="80" y2="140" stroke="#9f7aea" stroke-width="1"/>
  <line x1="200" y1="60" x2="100" y2="170" stroke="#9f7aea" stroke-width="1"/>
  <line x1="180" y1="140" x2="60" y2="180" stroke="#9f7aea" stroke-width="1"/>

  <!-- Title text -->
  <text x="320" y="90" text-anchor="middle" fill="#e2e8f0"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="26" font-weight="600">
    GhostAcademia-GraphPOC
  </text>

  <!-- Subtitle -->
  <text x="320" y="120" text-anchor="middle" fill="#a0aec0"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="14">
    Heterogeneous Graph Modeling for Academic Fraud Networks
  </text>

  <!-- Bottom tag -->
  <text x="320" y="150" text-anchor="middle" fill="#718096"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="11">
    Concept Validation (POC) inspired by Nature's Ghost Academia investigation
  </text>
</svg>
